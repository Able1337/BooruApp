name: Check public website
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public DNS, HTTP, HTTPS and certificate
        run: |
          getent ahostsv4 frank.eben-grad.ru
          curl --connect-timeout 10 --max-time 20 --silent --show-error --output /dev/null --write-out 'HTTP status=%{http_code} remote=%{remote_ip} redirect=%{redirect_url}\n' http://frank.eben-grad.ru/
          curl --connect-timeout 10 --max-time 20 --silent --show-error --fail --output /dev/null --write-out 'HTTPS status=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' https://frank.eben-grad.ru/healthz
          timeout 15 openssl s_client -connect frank.eben-grad.ru:443 -servername frank.eben-grad.ru < /dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
